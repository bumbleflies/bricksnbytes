<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Freundlicher Roboter aus Bausteinen, daneben Programmierblöcke" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .t { font-family: 'Fredoka', 'DM Sans', system-ui, sans-serif; font-weight: 600; }
    </style>
  </defs>

  <!-- Hintergrund -->
  <rect width="600" height="400" rx="28" fill="#E6F0FA"/>
  <circle cx="425" cy="215" r="155" fill="#D3E4F5"/>

  <!-- Funkeln -->
  <path d="M300 118 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5z" fill="#FF6B4A"/>
  <path d="M560 290 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#FFC24A"/>
  <circle cx="275" cy="330" r="5" fill="#0B2038" opacity=".25"/>
  <circle cx="570" cy="90" r="6" fill="#FF6B4A" opacity=".5"/>
  <circle cx="30" cy="40" r="4" fill="#0B2038" opacity=".25"/>

  <!-- Programmierblöcke -->
  <g class="t" font-size="16">
    <rect x="44" y="84" width="196" height="42" rx="14" fill="#FFC24A"/>
    <text x="62" y="111" fill="#0B2038">wenn ▶ geklickt</text>

    <rect x="66" y="126" width="24" height="7" rx="2" fill="#FF6B4A"/>
    <rect x="44" y="130" width="176" height="40" rx="8" fill="#FF6B4A"/>
    <text x="62" y="156" fill="#fff">wiederhole 10 ×</text>

    <rect x="44" y="168" width="26" height="110" fill="#FF6B4A"/>

    <rect x="92" y="170" width="24" height="7" rx="2" fill="#2BB5A6"/>
    <rect x="70" y="174" width="182" height="40" rx="8" fill="#2BB5A6"/>
    <text x="88" y="200" fill="#fff">gehe 10 Schritte</text>

    <rect x="92" y="214" width="24" height="7" rx="2" fill="#7B61FF"/>
    <rect x="70" y="218" width="160" height="40" rx="8" fill="#7B61FF"/>
    <text x="88" y="244" fill="#fff">sage „Hallo!“</text>

    <rect x="44" y="266" width="100" height="24" rx="8" fill="#FF6B4A"/>
  </g>

  <!-- Bausteine -->
  <g>
    <rect x="58" y="318" width="22" height="9" rx="3" fill="#239C8F"/>
    <rect x="98" y="318" width="22" height="9" rx="3" fill="#239C8F"/>
    <rect x="48" y="324" width="84" height="34" rx="6" fill="#2BB5A6"/>
    <rect x="152" y="318" width="22" height="9" rx="3" fill="#E6AC34"/>
    <rect x="142" y="324" width="58" height="34" rx="6" fill="#FFC24A"/>
    <rect x="218" y="318" width="22" height="9" rx="3" fill="#E85A3A"/>
    <rect x="210" y="324" width="40" height="34" rx="6" fill="#FF6B4A"/>
  </g>

  <!-- Sprechblase -->
  <g class="t">
    <path d="M252 36 h92 a12 12 0 0 1 12 12 v26 a12 12 0 0 1 -12 12 h-18 l14 18 -32 -18 h-56 a12 12 0 0 1 -12 -12 v-26 a12 12 0 0 1 12 -12z" fill="#fff"/>
    <text x="298" y="68" font-size="20" fill="#0B2038" text-anchor="middle">Hallo!</text>
  </g>

  <!-- Schatten -->
  <ellipse cx="420" cy="364" rx="112" ry="10" fill="#0B2038" opacity=".12"/>

  <!-- Antenne -->
  <line x1="420" y1="70" x2="420" y2="96" stroke="#0B2038" stroke-width="6" stroke-linecap="round"/>
  <circle cx="420" cy="64" r="10" fill="#FF6B4A"/>

  <!-- Kopf -->
  <rect x="370" y="84" width="28" height="14" rx="4" fill="#E85A3A"/>
  <rect x="442" y="84" width="28" height="14" rx="4" fill="#E85A3A"/>
  <rect x="348" y="94" width="144" height="92" rx="16" fill="#FF6B4A"/>
  <rect x="365" y="110" width="110" height="60" rx="11" fill="#0B2038"/>
  <circle cx="396" cy="135" r="11" fill="#7FE3D4"/>
  <circle cx="444" cy="135" r="11" fill="#7FE3D4"/>
  <circle cx="400" cy="131" r="3.5" fill="#fff"/>
  <circle cx="448" cy="131" r="3.5" fill="#fff"/>
  <path d="M402 153 Q420 165 438 153" fill="none" stroke="#7FE3D4" stroke-width="4" stroke-linecap="round"/>

  <!-- Hals -->
  <rect x="404" y="184" width="32" height="14" fill="#0B2038"/>

  <!-- Arme -->
  <rect x="312" y="212" width="28" height="74" rx="14" fill="#FF6B4A"/>
  <circle cx="326" cy="290" r="15" fill="#FFC24A"/>
  <rect x="502" y="140" width="28" height="74" rx="14" fill="#FF6B4A" transform="rotate(22 516 212)"/>
  <circle cx="543" cy="140" r="15" fill="#FFC24A"/>

  <!-- Körper -->
  <rect x="338" y="196" width="164" height="112" rx="18" fill="#0B2038"/>
  <rect x="368" y="214" width="104" height="56" rx="10" fill="#1C3A5E"/>
  <text x="420" y="252" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="28" font-weight="700" fill="#FF6B4A">&lt;/&gt;</text>
  <circle cx="394" cy="288" r="6" fill="#FFC24A"/>
  <circle cx="420" cy="288" r="6" fill="#7FE3D4"/>
  <circle cx="446" cy="288" r="6" fill="#FF6B4A"/>

  <!-- Räder -->
  <rect x="356" y="304" width="128" height="20" rx="8" fill="#FF6B4A"/>
  <circle cx="378" cy="338" r="22" fill="#0B2038"/>
  <circle cx="378" cy="338" r="8" fill="#FFC24A"/>
  <circle cx="462" cy="338" r="22" fill="#0B2038"/>
  <circle cx="462" cy="338" r="8" fill="#FFC24A"/>
</svg>
