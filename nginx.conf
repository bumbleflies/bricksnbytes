# Nginx configuration for serving Astro static site
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Serve from the dist directory (Astro build output)
    root /usr/share/nginx/html;
    index index.html;

    # Relative redirects (e.g. /impressum -> /impressum/) so they keep the
    # scheme and host of the TLS-terminating proxy in front of this container
    absolute_redirect off;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json;
    gzip_min_length 1000;

    # Cache static assets (CSS, JS, images)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing: Serve index.html for non-file requests
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Web app manifest (not in nginx's default mime.types)
    location = /site.webmanifest {
        default_type application/manifest+json;
    }

    # Old WordPress privacy page (still linked from the shop)
    location ~ ^/privacy-policy/?$ {
        return 301 /datenschutz/;
    }

    # Offer pages moved from /angebote/<slug> to top-level URLs
    location ~ ^/angebote/programmierkurse/?$ {
        return 301 /kurse/;
    }

    location ~ ^/angebote/(schulprojekttage|geburtstage|vorschule-hort)/?$ {
        return 301 /$1/;
    }

    location ~ ^/angebote/?$ {
        return 301 /;
    }

    # Old program pages were replaced by the course overview
    location ~ ^/programs(/.*)?$ {
        return 301 /kurse/;
    }

    # Contact form -> mailer process in the same container (mailer/server.mjs)
    location = /api/contact {
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
