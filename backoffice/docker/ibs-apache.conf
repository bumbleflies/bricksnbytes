# IBS backoffice Apache extras.
# The front controller (public/index.php) + a health endpoint that does NOT
# bootstrap the app: database-independent 200 for container healthchecks
# (also what CI uses) — bootstrap-dependent pages may 500 while MariaDB is
# missing, /healthz must not.
<Directory /var/www/html/public>
    Options -Indexes

    DirectoryIndex index.php index.html

    # Front controller for clean URLs (webroot = public/)
    FallbackResource /index.php

    # Never serve config or migration files from the web root even if
    # everything else fails; mirrored for public parent in case of misconfig.
    <FilesMatch "(^|/)\.ht|^config|(^|/)migrations/">
        Require all denied
    </FilesMatch>
</Directory>

<Directory /var/www/html>
    Options -Indexes
</Directory>

ServerName localhost
