name: Master Workflow

on:
  push:
    branches:
      - master
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "astro.config.mjs"
      - "tsconfig.json"
      - "Dockerfile"
      - "nginx.conf"
      - ".github/workflows/master.yml"
  workflow_dispatch:

jobs:
  pr-tests:
    uses: ./.github/workflows/pr-tests.yml

  build-publish:
    needs: pr-tests
    uses: ./.github/workflows/build-publish.yml
